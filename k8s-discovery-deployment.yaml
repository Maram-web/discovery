apiVersion: v1
kind: Namespace
metadata:
  name: discovery
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-service
  namespace: discovery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery-service
  template:
    metadata:
      labels:
        app: discovery-service
    spec:
      containers:
        - name: discovery-service
          image: marammanai/discovery-service:latest
          ports:
            - containerPort: 8761
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-service
  namespace: discovery
spec:
  type: NodePort
  selector:
    app: discovery-service
  ports:
    - port: 8761
      targetPort: 8761
      nodePort: 30011

#      nodePort: 30092  # ⬅ Accès via http://<VM_IP>:30092(doit être entre 30000–32767)
